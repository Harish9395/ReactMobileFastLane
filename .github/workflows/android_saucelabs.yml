name: Build Android and Upload to Sauce Labs

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: eu-central-1

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. NODE
      # ==================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false


      # ==================================================
      # 3. INSTALL NPM
      # ==================================================

      - name: Install npm dependencies
        run: npm install


      # ==================================================
      # 4. GENERATE ANDROID PROJECT
      # ==================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Generating React Native Android project"
          echo "========================================"

          rm -rf tmp

          npx react-native init tmp \
            --version 0.71.8 \
            --verbose

          test -d tmp/android
          test -f tmp/android/gradlew

          rm -rf android

          mv tmp/android android

          rm -rf tmp

          echo "Android project generated successfully"

          ls -la android


      # ==================================================
      # 5. PREPARE FASTLANE
      # ==================================================

      - name: Prepare Fastlane
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing Fastlane"
          echo "========================================"

          test -f fastlane/Fastfile

          mkdir -p android/fastlane

          cp fastlane/Fastfile android/fastlane/Fastfile

          test -f android/fastlane/Fastfile

          echo "Fastfile:"
          sed -n '1,260p' android/fastlane/Fastfile


      # ==================================================
      # 6. JAVA
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 7. ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0"


      # ==================================================
      # 8. GRADLE PERMISSION
      # ==================================================

      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ==================================================
      # 9. RUBY
      # ==================================================

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true


      # ==================================================
      # 10. RUBY DEPENDENCIES
      # ==================================================

      - name: Install Ruby dependencies
        run: |
          bundle install \
            --jobs 4 \
            --retry 3


      # ==================================================
      # 11. VERIFY SAUCE CREDENTIALS
      # ==================================================

      - name: Verify Sauce Labs configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Sauce Labs configuration"
          echo "========================================"

          if [ -z "$SAUCE_USERNAME" ]; then
            echo "ERROR: SAUCE_USERNAME is empty"
            exit 1
          fi

          if [ -z "$SAUCE_ACCESS_KEY" ]; then
            echo "ERROR: SAUCE_ACCESS_KEY is empty"
            exit 1
          fi

          echo "SAUCE_USERNAME is configured"
          echo "SAUCE_ACCESS_KEY is configured"
          echo "SAUCE_REGION=$SAUCE_REGION"


      # ==================================================
      # 12. VERIFY FASTLANE
      # ==================================================

      - name: Verify Fastlane
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Fastlane version"
          echo "========================================"

          bundle exec fastlane --version

          echo "========================================"
          echo "Fastfile"
          echo "========================================"

          test -f fastlane/Fastfile

          ls -lh fastlane/Fastfile


      # ==================================================
      # 13. BUILD APK + UPLOAD TO SAUCE
      # ==================================================

      - name: Build APK and upload to Sauce Labs
        working-directory: android
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_DISABLE_COLORS: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          CI: "true"

        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD + SAUCE UPLOAD"
          echo "========================================"

          bundle exec fastlane android upload_to_saucelabs


      # ==================================================
      # 14. VERIFY APK
      # ==================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "========================================"
          echo "APK verification"
          echo "========================================"

          test -f "$APK"

          ls -lh "$APK"

          file "$APK"


      # ==================================================
      # 15. SHOW SAUCE APP ID
      # ==================================================

      - name: Show Sauce Labs App Storage ID
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SAUCE APP STORAGE"
          echo "========================================"

          test -f android/sauce-app-id.txt
          test -f android/sauce-app-filename.txt

          echo "App ID:"
          cat android/sauce-app-id.txt

          echo ""

          echo "Filename:"
          cat android/sauce-app-filename.txt


      # ==================================================
      # 16. VERIFY FILE EXISTS IN SAUCE STORAGE
      # ==================================================

      - name: Verify APK exists in Sauce Labs Storage
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING SAUCE STORAGE"
          echo "========================================"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --user "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            "https://api.${SAUCE_REGION}.saucelabs.com/v1/storage/files?name=$(cat android/sauce-app-filename.txt | sed 's/storage:filename=//')" \
            > sauce-storage.json

          echo "Sauce Storage response:"

          cat sauce-storage.json


      # ==================================================
      # 17. UPLOAD APK TO GITHUB ARTIFACTS
      # ==================================================

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      # ==================================================
      # 18. UPLOAD SAUCE RESPONSE
      # ==================================================

      - name: Upload Sauce response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-upload-response
          path: |
            sauce-storage.json
            android/sauce-app-id.txt
            android/sauce-app-filename.txt
          if-no-files-found: warn
