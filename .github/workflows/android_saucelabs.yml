name: Build Android and Upload to Sauce Labs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Skipping web build for React Native project (no `build` script)

      - name: Prepare React Native native projects (retry + debug)
        run: |
          set -e
          echo "npx version:" && npx --version || true
          # Retry init a few times to avoid transient network failures
          RETRIES=3
          for i in $(seq 1 $RETRIES); do
            echo "Attempt $i: creating temporary react-native app"
            rm -rf tmp || true
            # Use only --version (avoid template resolution issues)
            if npx react-native init tmp --version 0.71.8 --verbose; then
              echo "init succeeded"
              break
            else
              echo "init failed on attempt $i"
              if [ "$i" -lt "$RETRIES" ]; then sleep $((i*2)); fi
            fi
          done

          if [ ! -d tmp ]; then
            echo "tmp directory not created. Listing workspace for debugging:" && ls -la
            exit 1
          fi

          if [ -d tmp/android ]; then
            rm -rf android || true
            mv tmp/android ./android
            echo "Moved tmp/android -> ./android"
            ls -la android || true
            # Restore fastlane config from the repo (in case android was replaced)
            if [ -f android/fastlane/Fastfile ]; then
              echo "fastlane already present in android/fastlane"
            else
              echo "Restoring android/fastlane from repository"
              git checkout -- android/fastlane || true
            fi
            ls -la android/fastlane || true
          else
            echo "tmp/android missing. tmp contents:" && ls -la tmp
            exit 1
          fi

          if [ -d tmp/ios ]; then
            rm -rf ios || true
            mv tmp/ios ./ios
            echo "Moved tmp/ios -> ./ios"
            ls -la ios || true
          else
            echo "tmp/ios missing (iOS not required on Linux). tmp contents:" && ls -la tmp || true
          fi

          rm -rf tmp || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK commandline tools and packages
        run: |
          set -e
          SDK_ROOT="/usr/local/android-sdk"
          sudo mkdir -p $SDK_ROOT
          curl -sS -o /tmp/commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          sudo unzip -q /tmp/commandlinetools.zip -d $SDK_ROOT/cmdline-tools
          sudo mkdir -p $SDK_ROOT/cmdline-tools/latest
          # If unzip created a nested cmdline-tools folder, move its contents into latest
          if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            sudo mv "$SDK_ROOT/cmdline-tools/cmdline-tools"/* "$SDK_ROOT/cmdline-tools/latest/"
          else
            # Move all entries except the newly-created 'latest' into latest
            for entry in "$SDK_ROOT/cmdline-tools"/*; do
              if [ "$entry" = "$SDK_ROOT/cmdline-tools/latest" ]; then
                continue
              fi
              sudo mv "$entry" "$SDK_ROOT/cmdline-tools/latest/"
            done
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          # Accept licenses non-interactively first
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_ROOT --licenses || true
          # Install required packages (do not pipe yes into install to avoid broken pipe)
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_ROOT "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew || true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: |
          gem install fastlane -NV

      - name: Run Fastlane lane (build + upload)
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          CI: 'true'
          FASTLANE_FASTFILE: ${{ github.workspace }}/android/fastlane/Fastfile
        run: |
          # Run fastlane from repo root and point to Fastfile via FASTLANE_FASTFILE env var
          fastlane android upload_to_saucelabs --verbose
      - name: Ensure `android/` exists before upload
        if: always()
        run: |
          echo "Checking android/ exists before upload"
          if [ -d android ]; then
            echo "android/ exists"
            ls -la android | sed -n '1,200p'
          else
            echo "android/ missing — attempting to generate again"
            rm -rf tmp || true
            if npx react-native init tmp --version 0.71.8 --verbose; then
              if [ -d tmp/android ]; then
                mv tmp/android ./android
                echo "Generated and moved android/"
                ls -la android | sed -n '1,200p'
              else
                echo "tmp/android still missing after init; tmp contents:" && ls -la tmp || true
                exit 1
              fi
            else
              echo "react-native init failed on retry; listing workspace:" && ls -la
              exit 1
            fi
          fi

      - name: Upload APK to Sauce Labs
        if: success()
        run: |
          APK_PATH=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK_PATH" ]; then echo "APK not found: $APK_PATH"; exit 1; fi
          curl -u $SAUCE_USERNAME:$SAUCE_ACCESS_KEY -X POST https://api.eu-central-1.saucelabs.com/v1/storage/upload?overwrite=true -F file=@$APK_PATH -F name=myapp.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
