name: Build Android and Upload to Sauce Labs

on:
  # push:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --------------------------------------------------
      # 3. Install React Native dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Generate Android native project
      # --------------------------------------------------
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          echo "Creating temporary React Native project..."

          rm -rf tmp

          npx react-native init tmp --version 0.71.8 --verbose

          echo "Checking generated Android project..."

          test -d tmp/android
          test -f tmp/android/gradlew

          echo "Replacing android directory..."

          rm -rf android
          mv tmp/android android

          rm -rf tmp

          echo "Android project created successfully."

          ls -la android

      # --------------------------------------------------
      # 5. Put our Fastfile inside Android project
      # --------------------------------------------------
      - name: Prepare Fastlane
        shell: bash
        run: |
          set -e

          echo "Checking repository Fastfile..."

          test -f fastlane/Fastfile

          echo "Creating android/fastlane..."

          mkdir -p android/fastlane

          cp fastlane/Fastfile android/fastlane/Fastfile

          echo "Fastfile copied successfully."

          ls -la android/fastlane

      # --------------------------------------------------
      # 6. Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 7. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 8. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.0"

      # --------------------------------------------------
      # 9. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # --------------------------------------------------
      # 10. Setup Ruby
      # --------------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --------------------------------------------------
      # 11. Install Ruby dependencies
      # --------------------------------------------------
      - name: Install Ruby dependencies
        run: |
          bundle install --jobs 4 --retry 3

      # --------------------------------------------------
      # 12. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Android directory:"
          ls -la android

          echo ""
          echo "Gradle wrapper:"
          ls -l android/gradlew

          echo ""
          echo "Fastlane:"
          ls -la android/fastlane

          test -f android/gradlew
          test -f android/fastlane/Fastfile

      # --------------------------------------------------
      # 13. Build APK + upload to Sauce Labs
      # --------------------------------------------------
      - name: Build and upload APK with Fastlane
        working-directory: android
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_GITHUB_ISSUES: '1'
          CI: 'true'
        run: |
          set -e

          echo "Running Fastlane from:"
          pwd

          echo ""
          echo "Fastfile:"
          ls -l fastlane/Fastfile

          echo ""
          echo "Running lane..."

          bundle exec fastlane android upload_to_saucelabs --verbose

      # --------------------------------------------------
      # 14. Upload APK as GitHub artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
