name: Build Android and Upload to Sauce Labs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Android build + Sauce Labs
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: ${{ secrets.SAUCE_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native Android project
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory is missing."
            echo "The native Android project must be committed to the repository."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew is missing."
            echo "The Android Gradle wrapper must be committed to the repository."
            exit 1
          fi

          echo "Android project found:"
          ls -la android
          ls -la android/gradle/wrapper || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease -Pci=true --stacktrace

      - name: Find APK
        id: apk
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          echo "APK found: $APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: |
          gem install fastlane -NV

      - name: Run Fastlane lane (build + upload)
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          CI: 'true'
          FASTLANE_FASTFILE: ${{ github.workspace }}/android/fastlane/Fastfile
        run: |
          # Run fastlane from repo root and point to Fastfile via FASTLANE_FASTFILE env var
          fastlane android upload_to_saucelabs --verbose
      

      - name: Upload APK to Sauce Labs
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -e

          REGION="${SAUCE_REGION:-eu-central-1}"
          API_URL="https://api.${REGION}.saucelabs.com/v1/storage/upload"

          echo "Uploading $APK_NAME to Sauce Labs"

          curl --fail-with-body \
            -u "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
            -X POST "$API_URL?overwrite=true" \
            -F "payload=@${APK_PATH}" \
            -F "name=${APK_NAME}"

          echo "Sauce Labs upload completed."
