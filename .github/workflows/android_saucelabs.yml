name: Android Build and Sauce Labs Test

on:
  workflow_dispatch:

  # Uncomment if you want automatic testing
  #
  # push:
  #   branches:
  #     - main
  #     - master

jobs:

  build-test:

    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: eu-central-1

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Node
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false


      # ============================================================
      # 3. Install npm dependencies
      # ============================================================

      - name: Install npm dependencies
        run: npm install


      # ============================================================
      # 4. Generate Android project
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |

          set -e

          echo "Generating React Native Android project..."

          rm -rf tmp

          npx react-native init tmp \
            --version 0.71.8 \
            --verbose

          test -d tmp/android
          test -f tmp/android/gradlew

          echo "Replacing android directory..."

          rm -rf android

          mv tmp/android android

          rm -rf tmp

          echo "Android project generated."

          ls -la android


      # ============================================================
      # 5. Copy Fastlane
      # ============================================================

      - name: Prepare Fastlane
        shell: bash
        run: |

          set -e

          test -f fastlane/Fastfile

          mkdir -p android/fastlane

          cp fastlane/Fastfile android/fastlane/Fastfile

          echo "Fastfile:"
          sed -n '1,260p' android/fastlane/Fastfile


      # ============================================================
      # 6. Java 17
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 7. Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        run: |

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0"


      # ============================================================
      # 8. Gradle permission
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ============================================================
      # 9. Ruby
      # ============================================================

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true


      # ============================================================
      # 10. Install Ruby dependencies
      # ============================================================

      - name: Install Ruby dependencies
        run: |

          bundle install \
            --jobs 4 \
            --retry 3


      # ============================================================
      # 11. Verify credentials
      # ============================================================

      - name: Verify Sauce credentials
        shell: bash
        run: |

          set -e

          if [ -z "$SAUCE_USERNAME" ]; then
            echo "SAUCE_USERNAME is missing"
            exit 1
          fi

          if [ -z "$SAUCE_ACCESS_KEY" ]; then
            echo "SAUCE_ACCESS_KEY is missing"
            exit 1
          fi

          echo "Sauce credentials are configured."


      # ============================================================
      # 12. Build + Upload using Fastlane
      # ============================================================

      - name: Build APK and upload to Sauce Labs
        working-directory: android
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_REGION: eu-central-1
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_DISABLE_COLORS: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          CI: "true"

        run: |

          set -e

          echo "=========================================="
          echo "FASTLANE BUILD + SAUCE UPLOAD"
          echo "=========================================="

          bundle exec fastlane android upload_to_saucelabs --verbose

          echo "=========================================="
          echo "SAUCE APP"
          echo "=========================================="

          cat sauce_app.txt

          echo

          echo "=========================================="
          echo "SAUCE APP ID"
          echo "=========================================="

          cat sauce_app_id.txt


      # ============================================================
      # 13. Export Sauce app information
      # ============================================================

      - name: Export Sauce app information
        shell: bash
        run: |

          set -e

          SAUCE_APP=$(cat android/sauce_app.txt)

          echo "SAUCE_APP=$SAUCE_APP" >> "$GITHUB_ENV"

          echo "Sauce application:"
          echo "$SAUCE_APP"


      # ============================================================
      # 14. Install Appium test dependencies
      # ============================================================

      - name: Install Appium test dependencies
        run: |

          npm install --save-dev \
            webdriverio \
            @wdio/cli \
            @wdio/local-runner \
            @wdio/mocha-framework \
            @wdio/spec-reporter


      # ============================================================
      # 15. Run Appium tests on Sauce Labs
      # ============================================================

      - name: Run Android Appium tests on Sauce Labs
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          SAUCE_APP: ${{ env.SAUCE_APP }}
          SAUCE_REGION: eu-central-1

        run: |

          set -e

          echo "=========================================="
          echo "RUNNING APPIUM TESTS"
          echo "=========================================="

          echo "Sauce App:"
          echo "$SAUCE_APP"

          npm test


      # ============================================================
      # 16. Upload APK to GitHub
      # ============================================================

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      # ============================================================
      # 17. Upload Sauce information
      # ============================================================

      - name: Upload Sauce metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sauce-app-information
          path: |
            android/sauce_app.txt
            android/sauce_app_id.txt
            android/sauce_app_filename.txt
          if-no-files-found: ignore
