name: Build Android and Upload to Sauce Labs

on:
  workflow_dispatch:

  # Uncomment when you want automatic builds:
  # push:
  #   branches:
  #     - main
  #     - master

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      # --------------------------------------------------
      # 3. Install npm dependencies
      # --------------------------------------------------
      - name: Install npm dependencies
        run: npm install

      # --------------------------------------------------
      # 4. Generate Android project
      # --------------------------------------------------
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          echo "Generating temporary React Native 0.71.8 project..."

          rm -rf tmp

          npx react-native init tmp --version 0.71.8 --verbose

          echo "Checking generated project..."

          test -d tmp/android
          test -f tmp/android/gradlew

          echo "Replacing android directory..."

          rm -rf android
          mv tmp/android android

          rm -rf tmp

          echo "Android project generated successfully."

          echo "Android contents:"
          ls -la android

      # --------------------------------------------------
      # 5. Install Fastlane configuration
      # --------------------------------------------------
      - name: Prepare Fastlane
        shell: bash
        run: |
          set -e

          test -f fastlane/Fastfile

          mkdir -p android/fastlane

          cp fastlane/Fastfile android/fastlane/Fastfile

          echo "Fastlane configuration:"
          ls -la android/fastlane

      # --------------------------------------------------
      # 6. Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 7. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0"

      # --------------------------------------------------
      # 8. Gradle permissions
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # --------------------------------------------------
      # 9. Ruby
      # --------------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --------------------------------------------------
      # 10. Install Ruby dependencies
      # --------------------------------------------------
      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      # --------------------------------------------------
      # 11. Verify everything before Fastlane
      # --------------------------------------------------
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "Workspace"
          echo "================================="
          pwd

          echo "================================="
          echo "Android"
          echo "================================="
          test -f android/gradlew
          ls -l android/gradlew

          echo "================================="
          echo "Fastlane"
          echo "================================="
          test -f android/fastlane/Fastfile
          ls -l android/fastlane/Fastfile

          echo "================================="
          echo "Ruby"
          echo "================================="
          ruby --version

          echo "================================="
          echo "Bundler"
          echo "================================="
          bundle --version

          echo "================================="
          echo "Fastlane"
          echo "================================="
          bundle exec fastlane --version

      # --------------------------------------------------
      # 12. Build APK + upload to Sauce Labs
      # --------------------------------------------------
      - name: Build and upload APK with Fastlane
        working-directory: android
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_DISABLE_COLORS: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          CI: 'true'
        run: |
          set -e

          echo "Running Fastlane from:"
          pwd

          echo "Fastfile:"
          ls -l fastlane/Fastfile

          bundle exec fastlane android upload_to_saucelabs --verbose

      # --------------------------------------------------
      # 13. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
